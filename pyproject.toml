[project]
name = "ei2fp"
version = "0.1.2"
description = ""
authors = [{ name = "Khrisanfov Mike", email = "khrisanfovmike@gmail.com" }]
requires-python = "==3.12.*"
readme = "README.md"
dependencies = [
    "numpy>=1.26.4",
    "pandas>=2.2.2,<3",
    "seaborn>=0.13.2,<0.14",
    "tqdm>=4.66.5,<5",
    "scikit-learn>=1.5.1,<2",
    "rdkit>=2024.3.5,<2025",
    "matplotlib>=3.9.1.post1,<4",
    "torch>=2.4.0,<3",
    "tensorboard>=2.17.0,<3",
]

[dependency-groups]
dev = [
    "torchinfo>=1.8.0,<2",
    "ipywidgets>=8.1.5,<9",
    "ipykernel>=6.29.5,<7",
    "networkx>=3.4.2,<4",
    "graphviz>=0.20.3,<0.21",
    "torchviz>=0.0.3,<0.0.4",
]

[[tool.uv.index]]
name = "pytorch"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch" }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
